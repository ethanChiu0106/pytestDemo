name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手動觸發:Actions 分頁按 Run workflow
  schedule:
    - cron: '0 18 * * *' # 每日 UTC 18:00 = 台灣 02:00,定時回歸

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # 與本機一致(CLAUDE.md:uvx ruff@0.13.2),版本鎖定避免本機過、CI 紅
      - name: Ruff lint
        run: uvx ruff@0.13.2 check .

      - name: Ruff format check
        run: uvx ruff@0.13.2 format --check .

  api-tests:
    needs: lint
    runs-on: ubuntu-latest

    # 被測後端:直接消費 mockServer CI 發佈的 image(兩條 pipeline 以 registry 解耦)
    services:
      mock-server:
        image: ghcr.io/ethanchiu0106/mockserver:latest
        env:
          SECRET_KEY: ${{ secrets.MOCK_SERVER_SECRET_KEY }}
        ports:
          - 8000:8000
        # image 內建 python(venv 在 PATH),用 urllib 打 /docs 當 health check
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # 快取依賴,加速後續執行

      - name: Install dependencies
        run: uv sync

      # secrets.yml 不進版控,CI 從 GitHub Secrets 還原(qa URL 即 localhost:8000)
      - name: Restore config/secrets.yml
        run: printf '%s' "$SECRETS_YML" > config/secrets.yml
        env:
          SECRETS_YML: ${{ secrets.SECRETS_YML }}

      # 路徑互補分割:UI 目錄以外全跑。每個測試檔必屬一個目錄,分割由檔案系統
      # 保證,未來新增測試目錄也自動落在這個 job,不可能靜默漏跑
      - name: Run API & WS tests
        run: uv run pytest --env qa --ignore=testcases/ui_test

      # 測試失敗也要留證據(報告產物),供 debug 與後續發佈
      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 14

  # UI 測試打公開的 SauceDemo,不需 service container;被測物是外部站台,
  # 與 api-tests 拆成獨立 job——外部不穩時互不拖累
  ui-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # runner 沒有瀏覽器,裝 chromium + 系統依賴;CI 無螢幕,pytest-playwright 預設 headless
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Restore config/secrets.yml
        run: printf '%s' "$SECRETS_YML" > config/secrets.yml
        env:
          SECRETS_YML: ${{ secrets.SECRETS_YML }}

      - name: Run UI tests
        run: uv run pytest --env qa testcases/ui_test

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results
          retention-days: 14

  # CD 概念示範:把 Allure 報告發佈到 GitHub Pages(報告即部署產物)
  publish-report:
    needs: [api-tests, ui-tests]
    if: always() # 測試紅燈也要發報告——失敗的報告更需要被看見
    runs-on: ubuntu-latest
    permissions:
      contents: write # 只有這個 job 需要寫入(推 gh-pages 分支),權限下放到 job 層級

    steps:
      # Pages 網址算一次給後面的 executor.json 與 Telegram 通知共用;
      # github.io 的 host 只吃小寫,owner 大小寫不能直接拼
      - name: Resolve Pages URL
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          echo "PAGES_URL=https://${OWNER_LC}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      # 兩個測試 job 的結果合併進同一個資料夾,產出一份 API+WS+UI 的完整報告
      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # 取回上次報告的 history,Allure 才能畫趨勢圖;第一次跑沒有 gh-pages 分支,容錯放行
      - name: Load report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 手動裝 Allure CLI 而非第三方 action:曾用的 Docker 型 action 因其
      # base image 從 Docker Hub 下架而失效——鎖 action 版本鎖不住它的底層依賴
      - name: Install Allure CLI
        run: |
          curl -sL -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
        env:
          ALLURE_VERSION: 2.44.1

      # build 編號來自 executor.json。缺這個檔時 Allure 每次都寫 buildOrder: 1,
      # 趨勢圖會把歷次結果全部疊在同一個 #1 上;用 run_number 才會遞增。
      # reportUrl 指向本輪的版本化子目錄——history 連結點回去才有真的舊報告,不會 404
      - name: Write executor.json
        run: |
          mkdir -p allure-results
          jq -n \
            --argjson buildOrder "$GITHUB_RUN_NUMBER" \
            --arg buildName "#${GITHUB_RUN_NUMBER} ${GITHUB_WORKFLOW}" \
            --arg buildUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg reportUrl "${PAGES_URL}/${GITHUB_RUN_NUMBER}" \
            '{name: "GitHub Actions", type: "github", reportName: "pytestDemo Allure Report",
              buildOrder: $buildOrder, buildName: $buildName, buildUrl: $buildUrl, reportUrl: $reportUrl}' \
            > allure-results/executor.json

      # history 塞回 results,Allure 才會畫趨勢圖(runner 內建 Java,免安裝)
      - name: Generate report with history
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/history; fi
          allure generate allure-results -o allure-report

      # 每輪報告以 run number 目錄保留(history 連結才有舊報告可點),root 仍放最新
      # 一份讓固定書籤照常可用;整個 site 重組後全量發佈,不靠 keep_files 累積髒狀態
      - name: Assemble site
        run: |
          mkdir site
          if [ -d gh-pages ]; then
            find gh-pages -mindepth 1 -maxdepth 1 -type d -regex '.*/[0-9]+' \
              -exec cp -r {} site/ \;
          fi
          rm -rf "site/${GITHUB_RUN_NUMBER}"
          cp -r allure-report "site/${GITHUB_RUN_NUMBER}"
          cp -r allure-report/. site/
          # ponytail: 只留最近 20 輪(與 Allure history 上限一致),更久的直接刪
          ls -d site/[0-9]*/ | sort -V | head -n -20 | xargs -r rm -rf

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

      # 通知放在發佈之後,訊息裡的報告連結才是通的。統計直接讀 Allure 產出的
      # summary.json,不另外解析 pytest stdout——同一份數字,單一來源
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_RESULT: ${{ needs.api-tests.result }}
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: |
          # 沒設 secret 就跳過:讓沒有 bot 的 fork 不會因為通知而紅燈
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 未設定,跳過通知"
            exit 0
          fi

          summary=allure-report/widgets/summary.json
          if [ -f "$summary" ]; then
            IFS=$'\t' read -r total passed failed broken skipped duration <<< \
              "$(jq -r '[.statistic.total, .statistic.passed, .statistic.failed,
                         .statistic.broken, .statistic.skipped, (.time.duration // 0)] | @tsv' "$summary")"
          else
            # 報告產不出來(測試 job 被取消、artifact 缺件)也要發訊息,否則最該通知的情況反而靜默
            total=0 passed=0 failed=0 broken=0 skipped=0 duration=0
          fi

          if [ "$API_RESULT" = success ] && [ "$UI_RESULT" = success ]; then
            headline='✅ 測試全數通過'
          else
            headline='❌ 測試失敗'
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text="$(printf '%s\n' \
            "<b>${GITHUB_REPOSITORY}</b> ・ ${headline}" \
            "" \
            "分支 <code>${GITHUB_REF_NAME}</code> ・ commit <code>${GITHUB_SHA:0:7}</code>" \
            "API: ${API_RESULT} ・ UI: ${UI_RESULT}" \
            "通過 ${passed}/${total}(失敗 ${failed}、broken ${broken}、跳過 ${skipped})" \
            "耗時 $((duration / 1000)) 秒" \
            "" \
            "📊 <a href=\"${PAGES_URL}/${GITHUB_RUN_NUMBER}\">Allure 報告</a> ・ 🔧 <a href=\"${run_url}\">CI Run #${GITHUB_RUN_NUMBER}</a>")"

          # 用 jq 組 JSON,訊息含中文與 < > 引號也不會把 payload 弄壞
          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$text" \
            '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}' \
          | curl -sS -f --retry 2 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' -d @- > /dev/null

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手動觸發:Actions 分頁按 Run workflow
  schedule:
    - cron: '0 18 * * *' # 每日 UTC 18:00 = 台灣 02:00,定時回歸

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # 與本機一致(CLAUDE.md:uvx ruff@0.13.2),版本鎖定避免本機過、CI 紅
      - name: Ruff lint
        run: uvx ruff@0.13.2 check .

      - name: Ruff format check
        run: uvx ruff@0.13.2 format --check .

  api-tests:
    needs: lint
    runs-on: ubuntu-latest

    # 被測後端:直接消費 mockServer CI 發佈的 image(兩條 pipeline 以 registry 解耦)
    services:
      mock-server:
        image: ghcr.io/ethanchiu0106/mockserver:latest
        env:
          SECRET_KEY: ${{ secrets.MOCK_SERVER_SECRET_KEY }}
        ports:
          - 8000:8000
        # image 內建 python(venv 在 PATH),用 urllib 打 /docs 當 health check
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # 快取依賴,加速後續執行

      - name: Install dependencies
        run: uv sync

      # secrets.yml 不進版控,CI 從 GitHub Secrets 還原(qa URL 即 localhost:8000)
      - name: Restore config/secrets.yml
        run: printf '%s' "$SECRETS_YML" > config/secrets.yml
        env:
          SECRETS_YML: ${{ secrets.SECRETS_YML }}

      # 路徑互補分割:UI 目錄以外全跑。每個測試檔必屬一個目錄,分割由檔案系統
      # 保證,未來新增測試目錄也自動落在這個 job,不可能靜默漏跑
      - name: Run API & WS tests
        run: uv run pytest --env qa --ignore=testcases/ui_test

      # 測試失敗也要留證據(報告產物),供 debug 與後續發佈
      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 14

  # UI 測試打公開的 SauceDemo,不需 service container;被測物是外部站台,
  # 與 api-tests 拆成獨立 job——外部不穩時互不拖累
  ui-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # runner 沒有瀏覽器,裝 chromium + 系統依賴;CI 無螢幕,pytest-playwright 預設 headless
      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Restore config/secrets.yml
        run: printf '%s' "$SECRETS_YML" > config/secrets.yml
        env:
          SECRETS_YML: ${{ secrets.SECRETS_YML }}

      - name: Run UI tests
        run: uv run pytest --env qa testcases/ui_test

      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results
          retention-days: 14

  # CD 概念示範:把 Allure 報告發佈到 GitHub Pages(報告即部署產物)
  publish-report:
    needs: [api-tests, ui-tests]
    if: always() # 測試紅燈也要發報告——失敗的報告更需要被看見
    runs-on: ubuntu-latest
    permissions:
      contents: write # 只有這個 job 需要寫入(推 gh-pages 分支),權限下放到 job 層級

    steps:
      # 兩個測試 job 的結果合併進同一個資料夾,產出一份 API+WS+UI 的完整報告
      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # 取回上次報告的 history,Allure 才能畫趨勢圖;第一次跑沒有 gh-pages 分支,容錯放行
      - name: Load report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 手動裝 Allure CLI 而非第三方 action:曾用的 Docker 型 action 因其
      # base image 從 Docker Hub 下架而失效——鎖 action 版本鎖不住它的底層依賴
      - name: Install Allure CLI
        run: |
          curl -sL -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
        env:
          ALLURE_VERSION: 2.44.1

      # history 塞回 results,Allure 才會畫趨勢圖(runner 內建 Java,免安裝)
      - name: Generate report with history
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/history; fi
          allure generate allure-results -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

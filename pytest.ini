[pytest]
testpaths = ./testcases
addopts = -vs --color=no --alluredir ./allure-results --clean-alluredir

#解決參數變為unicode問題
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

log_file = logs/pytest_logs.log
log_file_level = INFO
log_cli = true
log_cli_level = INFO
log_date_format = %Y-%m-%d %H:%M:%S:%f
log_format = %(asctime)s [%(levelname)s] [%(name)s] %(message)s (%(filename)s:%(lineno)s)

# marker 只表達目錄結構無法表達的橫切維度(層級跨 api/ui 子樹、方向跨檔案);
# API/UI、HTTP/WS 用路徑選(testcases/api_test、testcases/ui_test、api_test/http...)
markers =
    single: 單點測試(單一 API 或單一頁面,跨 API/UI)
    scenario: 情境測試(多步驟流程,跨 API/UI)
    positive: 正向案例
    negative: 反向案例